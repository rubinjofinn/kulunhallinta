<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<title>Kulunhallinta</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#73777f;--line:#e7e9ee;--dark:#111827;--green:#16803c;--red:#c23a36;--soft:#eef1f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding-bottom:90px}
.app{max-width:620px;margin:auto;min-height:100vh}header{padding:calc(18px + env(safe-area-inset-top)) 18px 12px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:27px;margin:0;font-weight:800}.month{border:0;background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.status{font-size:12px;color:var(--muted);margin-top:5px}.status.ok{color:var(--green)}.status.bad{color:var(--red)}
.balance-card{margin:8px 14px 14px;background:linear-gradient(145deg,#111827,#202939);color:#fff;border-radius:22px;padding:22px}.balance-label{font-size:13px;opacity:.72}.balance{font-size:36px;font-weight:850;margin:4px 0 16px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#ffffff12;border:1px solid #ffffff14;border-radius:14px;padding:12px}.mini small{display:block;opacity:.7;margin-bottom:4px}.mini strong{font-size:18px}
.section{padding:0 14px 14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.section-title h2{font-size:17px;margin:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:0;border-radius:16px;padding:16px 12px;font-weight:800;font-size:16px}.qexpense{background:#fff0ef;color:var(--red)}.qincome{background:#eefaf1;color:var(--green)}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}.txmain{min-width:0;flex:1}.txmain strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain small{color:var(--muted)}.amt{font-weight:800}.inc{color:var(--green)}.exp{color:var(--red)}
.catrow{margin:13px 0}.cathead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}.bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden}.fill{height:100%;background:#222b3a;border-radius:99px}.empty{color:var(--muted);text-align:center;padding:24px 8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);height:74px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{border:0;background:transparent;font-size:12px;color:var(--muted);font-weight:700}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav .active{color:var(--dark)}.view{display:none}.view.active{display:block}
.fab{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:92px;width:58px;height:58px;border-radius:50%;border:0;background:#111827;color:white;font-size:31px;z-index:20}
.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:50}.sheet.open{display:flex}.sheetbox{width:min(620px,100%);margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.handle{width:44px;height:5px;border-radius:99px;background:#d1d5db;margin:0 auto 15px}
label{font-size:13px;font-weight:750;display:block;margin:13px 0 6px}input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font:inherit;background:#fff}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;background:#111827;color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:800;margin-top:16px}.close{float:right;border:0;background:var(--soft);border-radius:10px;width:34px;height:34px}
.auth{position:fixed;inset:0;background:#f5f6f8;z-index:100;display:grid;place-items:center;padding:20px}.auth.hidden{display:none}.authbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.authbox h2{margin-top:0}.authbox button{width:100%;border:0;background:#111827;color:#fff;border-radius:13px;padding:14px;font-weight:800;margin-top:12px}
.refresh{width:100%;border:0;background:#eef1f5;color:#111827;border-radius:13px;padding:13px;font-weight:800}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="authbox"><h2>Kulunhallinta</h2><p style="color:#73777f;line-height:1.5">Syötä perheen yhteinen käyttöavain. Tämä tarvitsee tehdä vain kerran tällä laitteella.</p><label>Käyttöavain</label><input id="accessKey" type="password" autocomplete="current-password"><button onclick="saveKey()">Avaa sovellus</button><div id="authError" class="status bad"></div></div></div>
<div class="app"><header><div class="topline"><div><h1>Kulunhallinta</h1><div id="status" class="status">Yhdistetään…</div></div><input id="monthPicker" class="month" type="month"></div></header><main>
<section id="homeView" class="view active"><div class="balance-card"><div class="balance-label">Kuukaudessa jäljellä</div><div id="balance" class="balance">0,00 €</div><div class="twocol"><div class="mini"><small>Tulot</small><strong id="income">0,00 €</strong></div><div class="mini"><small>Menot</small><strong id="expense">0,00 €</strong></div></div></div><div class="section"><div class="quick"><button class="qexpense" onclick="openSheet('expense')">− Lisää meno</button><button class="qincome" onclick="openSheet('income')">＋ Lisää tulo</button></div></div><div class="section"><div class="section-title"><h2>Viimeisimmät</h2></div><div class="card" id="recentList"></div></div><div class="section"><div class="section-title"><h2>Mihin raha menee?</h2></div><div class="card" id="categoryBars"></div></div></section>
<section id="transactionsView" class="view"><div class="section"><div class="section-title"><h2>Kaikki tapahtumat</h2></div><div class="card" id="allList"></div></div></section><section id="budgetView" class="view"><div class="section"><div class="section-title"><h2>Kuukauden yhteenveto</h2></div><div class="card" id="budgetCats"></div></div></section><section id="settingsView" class="view"><div class="section"><div class="section-title"><h2>Asetukset</h2></div><div class="card"><button class="refresh" onclick="loadData()">Päivitä tiedot</button><button class="refresh" style="margin-top:10px" onclick="forgetKey()">Kirjaudu ulos tältä laitteelta</button></div></div></section></main><button class="fab" onclick="openSheet('expense')">+</button><nav class="nav"><button class="active" data-view="homeView"><span>⌂</span>Koti</button><button data-view="transactionsView"><span>☷</span>Tapahtumat</button><button data-view="budgetView"><span>◔</span>Yhteenveto</button><button data-view="settingsView"><span>⚙</span>Asetukset</button></nav></div>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheetbox"><div class="handle"></div><button class="close" onclick="closeSheet()">✕</button><h3 id="sheetTitle">Lisää meno</h3><form id="txForm"><input id="txType" type="hidden"><div class="formrow"><div><label>Päivämäärä</label><input id="date" type="date" required></div><div><label>Summa (€)</label><input id="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required></div></div><label>Selite</label><input id="description" required><label>Kategoria</label><select id="category"></select><label>Kenen?</label><select id="person"><option>Yhteinen</option><option>Rupert</option><option>Maria</option></select><button id="saveBtn" class="save">Tallenna</button></form></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwju29lsVBGr2W0tFHqySPrqp2LpBckS_tQlcUhb5rlhW4lyk8epKfmCbIsST0iIrtc/exec";
const expenseCats=["Asuminen","Ruoka & päivittäistavarat","Auto & liikenne","Lapset & perhe","Laskut & sopimukset","Terveys & hyvinvointi","Vapaa-aika & ravintolat","Ostokset","Matkat","Vakuutukset","Velat & lainat","Säästäminen & sijoittaminen","Muu"];const incomeCats=["Palkka","Sivutulot","Yritystulot","Tuet & etuudet","Palautukset","Muu tulo"];const icons={"Asuminen":"🏠","Ruoka & päivittäistavarat":"🛒","Auto & liikenne":"🚗","Lapset & perhe":"👨‍👩‍👧","Laskut & sopimukset":"🧾","Terveys & hyvinvointi":"❤","Vapaa-aika & ravintolat":"☕","Ostokset":"🛍","Matkat":"✈","Vakuutukset":"🛡","Velat & lainat":"💳","Säästäminen & sijoittaminen":"📈","Palkka":"💼","Sivutulot":"＋","Yritystulot":"🏢","Tuet & etuudet":"€","Palautukset":"↩"};const $=id=>document.getElementById(id);let data=[];let accessKey=localStorage.getItem("kulut_access_key")||"";
function today(){return new Date().toISOString().slice(0,10)}function euro(n){return Number(n).toLocaleString("fi-FI",{style:"currency",currency:"EUR"})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function setStatus(t,ok=null){$("status").textContent=t;$("status").className="status"+(ok===true?" ok":ok===false?" bad":"")}$("date").value=today();$("monthPicker").value=today().slice(0,7);
function saveKey(){accessKey=$("accessKey").value.trim();if(!accessKey)return;localStorage.setItem("kulut_access_key",accessKey);testKey()}function forgetKey(){localStorage.removeItem("kulut_access_key");accessKey="";$("auth").classList.remove("hidden");$("accessKey").value=""}window.saveKey=saveKey;window.forgetKey=forgetKey;
function jsonp(action){return new Promise((resolve,reject)=>{const cb="kulut_cb_"+Date.now()+"_"+Math.floor(Math.random()*10000);const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"))},12000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=(res)=>{cleanup();resolve(res)};s.onerror=()=>{cleanup();reject(new Error("network"))};s.src=API_URL+"?action="+encodeURIComponent(action)+"&key="+encodeURIComponent(accessKey)+"&callback="+encodeURIComponent(cb)+"&_="+Date.now();document.head.appendChild(s)})}
async function testKey(){$("authError").textContent="";try{const r=await jsonp("ping");if(!r.ok)throw new Error("bad key");$("auth").classList.add("hidden");loadData()}catch(e){$("authError").textContent="Käyttöavain ei kelpaa tai yhteys ei toimi."}}
async function loadData(){setStatus("Ladataan yhteisiä tietoja…");try{const r=await jsonp("list");if(!r.ok){if(r.error==="Unauthorized"){forgetKey();return}throw new Error(r.error||"error")}data=r.items||[];render();setStatus("Google Sheets ajan tasalla",true)}catch(e){setStatus("Tietojen lataus epäonnistui",false)}}window.loadData=loadData;
async function post(payload){await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...payload,key:accessKey})})}
function setCats(type){$("category").innerHTML=(type==="income"?incomeCats:expenseCats).map(c=>`<option>${c}</option>`).join("")}function openSheet(type){$("txType").value=type;setCats(type);$("sheetTitle").textContent=type==="income"?"Lisää tulo":"Lisää meno";$("sheet").classList.add("open")}function closeSheet(){$("sheet").classList.remove("open")}window.openSheet=openSheet;window.closeSheet=closeSheet;
$("txForm").addEventListener("submit",async e=>{e.preventDefault();const item={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),type:$("txType").value,date:$("date").value,amount:Number($("amount").value),description:$("description").value.trim(),category:$("category").value,person:$("person").value};$("saveBtn").disabled=true;$("saveBtn").textContent="Tallennetaan…";setStatus("Tallennetaan…");try{await post({action:"add",item});$("amount").value="";$("description").value="";closeSheet();await new Promise(r=>setTimeout(r,900));await loadData()}catch(e){setStatus("Tallennus epäonnistui",false);alert("Tallennus epäonnistui.")}finally{$("saveBtn").disabled=false;$("saveBtn").textContent="Tallenna"}});
async function deleteTx(id){if(!confirm("Poistetaanko tämä tapahtuma?"))return;try{await post({action:"delete",id});await new Promise(r=>setTimeout(r,900));await loadData()}catch(e){alert("Poisto epäonnistui.")}}window.deleteTx=deleteTx;
function monthData(){const m=$("monthPicker").value;return data.filter(x=>!m||x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date))}function txHtml(rows,limit){const list=limit?rows.slice(0,limit):rows;if(!list.length)return `<div class="empty">Ei tapahtumia tässä kuussa.</div>`;return list.map(x=>`<div class="tx" onclick="deleteTx('${x.id}')"><div class="icon">${icons[x.category]||"•"}</div><div class="txmain"><strong>${esc(x.description)}</strong><small>${esc(x.category)} · ${esc(x.person)} · ${new Date(x.date+"T00:00:00").toLocaleDateString("fi-FI")}</small></div><div class="amt ${x.type==="income"?"inc":"exp"}">${x.type==="income"?"+":"−"}${euro(x.amount)}</div></div>`).join("")}function barsHtml(rows){const exp=rows.filter(x=>x.type==="expense"),s={};exp.forEach(x=>s[x.category]=(s[x.category]||0)+x.amount);const p=Object.entries(s).sort((a,b)=>b[1]-a[1]);if(!p.length)return `<div class="empty">Ei menoja tässä kuussa.</div>`;const max=p[0][1];return p.map(([k,v])=>`<div class="catrow"><div class="cathead"><span>${icons[k]||"•"} ${esc(k)}</span><strong>${euro(v)}</strong></div><div class="bar"><div class="fill" style="width:${Math.max(4,v/max*100)}%"></div></div></div>`).join("")}function render(){const rows=monthData(),inc=rows.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0),exp=rows.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0);$("balance").textContent=euro(inc-exp);$("income").textContent=euro(inc);$("expense").textContent=euro(exp);$("recentList").innerHTML=txHtml(rows,5);$("allList").innerHTML=txHtml(rows);$("categoryBars").innerHTML=barsHtml(rows);$("budgetCats").innerHTML=barsHtml(rows)}$("monthPicker").addEventListener("change",render);document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(b.dataset.view).classList.add("active")}));if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});if(accessKey){$("accessKey").value=accessKey;testKey()}
</script></body></html>
